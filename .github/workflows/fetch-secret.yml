name: Fetch Secret from AWS

# Only this workflow gets AWS access. It authenticates via OIDC (no stored
# AWS keys) and runs under the `production` GitHub Environment, which should
# be configured with a required reviewer — see docs/03-github-setup.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reveal_secret:
        description: "Print the raw secret value in logs (debug only - leave off)"
        type: boolean
        default: false

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  fetch-secret:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY DEBUG STEP - remove once the OIDC trust policy is confirmed
      # working. Prints the actual token claims GitHub sends, so they can be
      # compared byte-for-byte against the IAM role's trust policy instead
      # of assuming what they should be.
      - name: Debug - print OIDC token claims
        run: |
          IDTOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo -n "$IDTOKEN" | cut -d '.' -f2 | tr '_-' '/+')
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "$PAYLOAD" | base64 -d | jq '{aud, sub, repository, ref, repository_owner}'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Fetch and use secret
        env:
          SECRET_NAME: ${{ vars.SECRET_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python app/fetch_secret.py
