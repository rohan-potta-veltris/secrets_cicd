name: Fetch Secret from AWS

# Only this workflow gets AWS access. It authenticates via OIDC (no stored
# AWS keys) and runs under the `production` GitHub Environment, which should
# be configured with a required reviewer — see docs/03-github-setup.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reveal_secret:
        description: "Print the raw secret value in logs (debug only - leave off)"
        type: boolean
        default: false

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  fetch-secret:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Fetch and use secret
        env:
          SECRET_NAME: ${{ vars.SECRET_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python app/fetch_secret.py
